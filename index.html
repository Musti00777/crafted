<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CRAFTED turns your idea into a clear, structured prompt."
    />
    <meta name="theme-color" content="#faf8f3" />
    <title>CRAFTED — Build better prompts</title>

    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
  </head>
  <body>
    <div class="app-shell" data-app data-status="loading">
      <header class="site-header">
        <a class="brand" href="./" aria-label="CRAFTED home">
          <span class="brand__mark" aria-hidden="true">C</span>
          <span class="brand__name">CRAFTED</span>
        </a>
      </header>

      <main class="site-main">
        <section class="hero-card" aria-labelledby="hero-title">
          <p class="eyebrow">Thoughtful prompts, made simple</p>
          <h1 id="hero-title">Let’s <span>CRAFT</span> your idea.</h1>
          <p class="hero-card__subtitle">
            Turn your idea into a clear, structured prompt.
          </p>

          <ul class="framework-list" aria-label="The CRAFT framework">
            <li><strong>C</strong><span>Context</span></li>
            <li><strong>R</strong><span>Role</span></li>
            <li><strong>A</strong><span>Action</span></li>
            <li><strong>F</strong><span>Format</span></li>
            <li><strong>T</strong><span>Tone</span></li>
          </ul>
        </section>
      </main>

      <footer class="site-footer">
        <p>CRAFTED <span aria-hidden="true">·</span> A clearer way to prompt.</p>
      </footer>
    </div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
